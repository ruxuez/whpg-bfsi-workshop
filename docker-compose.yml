services:
  # ─── RustFS (S3-compatible store for Apache Iceberg / PGAA) ──────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    hostname: rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - converged-analytics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ─── S3 client: creates the bucket, then stays up for `docker exec s3cli aws s3 ...`
  s3cli:
    image: amazon/aws-cli:latest
    container_name: s3cli
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - converged-analytics-network
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws s3api head-bucket --bucket whpg-lakehouse 2>/dev/null || aws s3 mb s3://whpg-lakehouse
        echo "Bucket whpg-lakehouse ready"
        exec sleep infinity

# ─── WHPG Cluster: 1 Coordinator + 2 Segments ───────────────────────────────────
  whpg_cdw:
    build:
      context: .
      secrets:
        - repo_token
    image: whpg_cdw
    platform: linux/amd64
    container_name: cdw
    hostname: cdw
    tty: true
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    networks:
      - converged-analytics-network
    ports:
      - "5432:5432"
      - "8081:8081"    # gpfdist (CSV bulk load)
      - "5000:5000"    # Lab 2 — PGAA Benchmark dashboard
      - "5001:5001"    # Lab 1 — Network Analytics dashboard
      - "5002:5002"    # Lab 3 — AI Analytics dashboard
      - "5003:5003"    # Lab 3 — AI Analytics dashboard
    volumes:
      - master:/data/master
      - ./scripts:/scripts:ro
      - ./csv_data:/csv_data:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/master/gpinitsystem_complete &&  su - gpadmin -c \"psql -d template1 -c 'SELECT 1'\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  whpg_seg1:
    image: whpg_cdw
    depends_on:
      whpg_cdw:
        condition: service_started
    container_name: sdw1
    hostname: sdw1
    tty: true
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    platform: linux/amd64
    networks:
      - converged-analytics-network
    volumes:
      - sdw1_primary1:/data1/primary
      - sdw1_primary2:/data2/primary
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x postgres > /dev/null || pgrep -x sshd > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  whpg_seg2:
    image: whpg_cdw
    depends_on:
      whpg_cdw:
        condition: service_started
    container_name: sdw2
    hostname: sdw2
    tty: true
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    platform: linux/amd64
    networks:
      - converged-analytics-network
    volumes:
      - sdw2_primary1:/data1/primary
      - sdw2_primary2:/data2/primary
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x postgres > /dev/null || pgrep -x sshd > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  master:
  sdw1_primary1:
  sdw1_primary2:
  sdw2_primary1:  
  sdw2_primary2:
  rustfs-data:  # /data   — RustFS object storage

networks:
  converged-analytics-network:
    name: converged-analytics-network

secrets:
  repo_token:
    environment: EDB_SUBSCRIPTION_TOKEN
